name: PVPT Demo Browser Smoke Tests

on:
  push:
    branches: [main, demo/total-system]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate Agent Skills
        run: npm run validate:skills
      - name: Rebuild and verify the scenario bank
        run: |
          mkdir -p test-results
          python3 scenario-lab/run.py --db "$RUNNER_TEMP/pvpt.sqlite" --report "$RUNNER_TEMP/matrix.json"
          python3 scenario-lab/executive.py --db "$RUNNER_TEMP/pvpt.sqlite" --report "$RUNNER_TEMP/executive.json"
          python3 -m unittest discover -s scenario-lab -p 'test_*.py'
          diff -u scenario-lab/evidence/summary.json "$RUNNER_TEMP/matrix.json"
          diff -u scenario-lab/evidence/executive.json "$RUNNER_TEMP/executive.json"
      - name: Run desktop and mobile browser scenarios
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: npm run test:demo -- --reporter=list,json
      - name: Upload browser QA screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvpt-demo-browser-qa
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
