<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پارس | اثبات مفهوم حفاظت از تعهدات</title>
<link rel="stylesheet" href="style.css">
<script defer src="model.js"></script>
<script defer src="view.js"></script>
</head>
<body>
<header>
  <div class="brand"><span>PARS</span><small>مدیریت ارزش و تعهدات</small></div>

</header>
<main>
  <nav aria-label="فضای کاری" id="roles">

    <button data-role="assessor">مدیر ارزیاب</button><button data-role="executive">مدیر تصمیم‌گیر</button>
  </nav>
  <div id="notice" role="status"></div>
  <section id="screen" aria-label="محتوای فضای کاری"></section>
